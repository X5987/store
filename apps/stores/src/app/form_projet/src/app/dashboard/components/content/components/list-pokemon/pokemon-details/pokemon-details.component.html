<mat-toolbar>
  <button mat-button [routerLink]="'/personal/content'">Retour</button>
</mat-toolbar>

@if (pokemon() !== undefined) {
  @let poke = pokemon();

  <div class="cart-wrapper">
    <div class="card">
      <div class="top">
        <span class="hp">HP {{ poke?.stats?.HP }}</span>
      </div>
      <img ngSrc="poke?.image" [alt]="poke?.name" class="pokemon-img" fill>
      <h2>{{ poke?.name }}</h2>

      <div class="type-wrapper">
        @for (type of poke?.apiTypes; track type.name) {
          <div class="type">
            <img ngSrc="poke?.apiTypes" [alt]="poke?.image" class="type-img" fill>
            <span>{{ type.name }}</span>
          </div>
        }
      </div>

      <div class="stats">
        <div class="stat">
          <p>{{ poke?.stats?.attack }}</p>
          <span>Attack</span>
        </div>
        <div class="stat">
          <p>{{ poke?.stats?.defense }}</p>
          <span>Defense</span>
        </div>
        <div class="stat">
          <p>{{ poke?.stats?.speed }}</p>
          <span>Speed</span>
        </div>
        <div class="stat-power">
<!--          <p>{{ fullPower() }}</p>-->
          <span>Power</span>
        </div>
      </div>
    </div>
  </div>
}
